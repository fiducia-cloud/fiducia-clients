name: Finalize TypeScript browser hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/materialize-ts-fetch-binding-format.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: materialize-ts-browser-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ts-browser-e2e-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ts-browser-e2e-hardening
          fetch-depth: 0

      - name: Normalize generated source and connect the CDP driver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          template = Path("templates/typescript.ts.tmpl")
          template_text = template.read_text(encoding="utf-8")
          constructor = template_text.index("  constructor(baseUrl: string")
          start = template_text.index("    if (opts.fetch) {", constructor)
          end = template_text.index("    this.requestTimeoutMs", start)
          normalized = '''    if (opts.fetch) {
            this.fetchImpl = opts.fetch;
          } else {
            const defaultFetch = globalThis.fetch;
            if (typeof defaultFetch !== "function") {
              throw new Error("fiducia: global fetch is unavailable; provide opts.fetch");
            }
            // Browser fetch is a Web IDL method and must retain its global receiver.
            this.fetchImpl = defaultFetch.bind(globalThis);
          }
          '''
          # Dedent the heredoc's visual indentation without weakening the exact
          # constructor-boundary replacement.
          import textwrap
          normalized = textwrap.dedent(normalized)
          if not normalized.startswith("    if (opts.fetch) {"):
              raise SystemExit("normalized constructor block lost class indentation")
          template.write_text(
              template_text[:start] + normalized + template_text[end:],
              encoding="utf-8",
          )

          browser = Path("clients/ts/browser-smoke.mjs")
          browser_text = browser.read_text(encoding="utf-8")
          import_anchor = 'import process from "node:process";\n'
          cdp_import = 'import { runBrowserContract } from "./chrome-cdp.mjs";\n'
          if cdp_import not in browser_text:
              if browser_text.count(import_anchor) != 1:
                  raise SystemExit("browser process import anchor is not unique")
              browser_text = browser_text.replace(
                  import_anchor,
                  import_anchor + cdp_import,
                  1,
              )

          start = browser_text.index("async function runChrome() {")
          end_marker = '  await rm(profile, { recursive: true, force: true });\n}'
          end = browser_text.index(end_marker, start) + len(end_marker)
          old_runner = browser_text[start:end]
          if '"--dump-dom"' not in old_runner or "stdout.includes" not in old_runner:
              raise SystemExit("browser runner is not the reviewed dump-dom implementation")
          replacement = '''try {
            await runBrowserContract({ chromePath, pageUrl, profile });
            console.log("Fiducia TypeScript browser contract passed in real Chrome");
          } finally {
            await new Promise((resolve) => server.close(resolve));
            await rm(profile, { recursive: true, force: true });
          }'''
          replacement = textwrap.dedent(replacement)
          browser.write_text(
              browser_text[:start] + replacement + browser_text[end:],
              encoding="utf-8",
          )
          PY

          python3 generate.py ts
          python3 generate.py --check ts
          node --check clients/ts/browser-smoke.mjs
          node --check clients/ts/chrome-cdp.mjs
          git diff --check

      - name: Commit only deterministic outputs and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-ts-fetch-binding-format.yml
          git add \
            templates/typescript.ts.tmpl \
            clients/ts/fiducia.ts \
            clients/ts/browser-smoke.mjs
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/materialize-ts-fetch-binding-format.yml
            clients/ts/browser-smoke.mjs
            clients/ts/fiducia.ts
            templates/typescript.ts.tmpl
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test(ts): drive Chrome through the DevTools protocol"
          git push origin HEAD:agent/ts-browser-e2e-hardening
