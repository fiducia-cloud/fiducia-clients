name: support-tier-drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/support-tier-drift.yml"
      - ".zpkg.toml"
      - "clients/**"
      - "generate.py"
      - "operations.json"
      - "scripts/check-support-tiers.mjs"
      - "templates/**"
  pull_request:
    paths:
      - ".github/workflows/support-tier-drift.yml"
      - ".zpkg.toml"
      - "clients/**"
      - "generate.py"
      - "operations.json"
      - "scripts/check-support-tiers.mjs"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/support-tier-drift.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate the inventory checker
        run: node --check scripts/check-support-tiers.mjs
      - name: Enforce support, maintenance, and publication inventory
        run: node scripts/check-support-tiers.mjs
      - name: Enforce generated client and endpoint drift
        run: python3 generate.py --check
