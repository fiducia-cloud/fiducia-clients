name: DEN-3982 refresh client implementation evidence

on:
  push:
    branches:
      - "fix/DEN-3982-current-main-dart-publish-contract"
    paths:
      - ".github/workflows/den-3982-refresh-client-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-3982-refresh-client-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head with branch write credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Verify source branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/DEN-3982-current-main-dart-publish-contract"

      - name: Install pinned manifest-refresh dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Refresh and validate the committed implementation evidence
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(mktemp)"
          python3 scripts/refresh_client_contract_manifest.py --output "${candidate#"$PWD/"}"
          cp "$candidate" clients/contract-manifest.json
          rm "$candidate"
          python3 scripts/verify_client_contract.py

      - name: Commit only the refreshed evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- clients/contract-manifest.json; then
            echo "implementation evidence is already current"
            exit 0
          fi
          git diff --check -- clients/contract-manifest.json
          git config user.name "ORESoftware"
          git config user.email "alex@oresoftware.com"
          git add -- clients/contract-manifest.json
          git commit -m "chore(DEN-3982): refresh Dart implementation fingerprint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
