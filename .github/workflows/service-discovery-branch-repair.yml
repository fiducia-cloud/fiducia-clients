name: service-discovery-branch-repair

on:
  push:
    branches:
      - agent/service-discovery-watch-reducer-20260903
    paths:
      - ".github/workflows/service-discovery-branch-repair.yml"
      - "clients/**"
      - "generate.py"
      - "operations.json"
      - "scripts/harden_client_contract.py"
      - "scripts/check-support-tiers.mjs"
      - "templates/**"

permissions:
  contents: write

concurrency:
  group: service-discovery-branch-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'fiducia-cloud/fiducia-clients'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/service-discovery-watch-reducer-20260903
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned contract tooling
        run: >-
          python -m pip install --disable-pip-version-check
          jsonschema==4.25.1 tomlkit==0.13.3 referencing==0.36.2 rpds-py==0.27.0

      - name: Repair product-source detection and remove obsolete scaffolds
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/harden_client_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '''def has_product_implementation(directory: Path) -> bool:
              """Return true when a runtime already owns source code in its native layout."""

              source_roots = (
                  directory / "src",
                  directory / "lib",
                  directory / "include",
                  directory / "Sources",
                  directory / "zed_pkg_client",
              )
              if any(root.is_dir() and any(item.is_file() for item in root.rglob("*")) for root in source_roots):
                  return True
              return any((directory / filename).is_file() for filename in ("client.go", "mod.ts"))
          '''
          new = '''def has_product_implementation(directory: Path) -> bool:
              """Return true when a runtime already owns non-test source code.

              Mature SDKs may keep their primary implementation at the package
              root (for example ``fiducia.go`` or ``fiducia.dart``), not only in
              ``src/`` or ``lib/``. Reuse the same recursive source vocabulary as
              contract fingerprinting so the hardener never adds a competing
              scaffold package beside a real implementation.
              """

              for path in sorted(directory.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(directory)
                  if CONTRACT_IGNORED_PARTS.intersection(relative.parts):
                      continue
                  if path.suffix.lower() in CONTRACT_SOURCE_SUFFIXES:
                      return True
              return False
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("unrecognized has_product_implementation implementation")

          # These were generated by the old root-source blind spot and conflict
          # with the actual package implementations.
          for stale in (
              Path("clients/go/client.go"),
              Path("clients/dart/lib/fiducia_client.dart"),
          ):
              stale.unlink(missing_ok=True)
          PY

      - name: Regenerate canonical clients and contract fingerprints
        run: |
          set -euo pipefail
          python3 generate.py ts
          python3 scripts/harden_client_contract.py \
            --root . \
            --schema schemas/client-api.schema.json \
            --write \
            --output /tmp/client-contract-hardening.json
          cat /tmp/client-contract-hardening.json

      - name: Validate regenerated repository state
        run: |
          set -euo pipefail
          node scripts/check-support-tiers.mjs
          python3 generate.py --check
          python3 scripts/verify_client_contract.py
          git diff --check
          if grep -RInE --exclude-dir=.git '^(<<<<<<< .+|=======|>>>>>>> .+)$' .; then
            echo '::error::conflict markers remain after semantic repair'
            exit 1
          fi

      - name: Commit the deterministic repair
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Generated state is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "ORESoftware automation"
          git config user.email "automation@oresoftware.com"
          git commit -m "fix(clients): repair generated contract drift"
          git push origin HEAD:agent/service-discovery-watch-reducer-20260903
