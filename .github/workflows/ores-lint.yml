# Managed by .ores-lint/. Update the runtime and this workflow coherently.
name: ores-lint

on:
  pull_request:
  workflow_dispatch:
  # Add `push:` once repository lint debt is explicitly promoted to a gate.

permissions:
  contents: read

concurrency:
  group: ores-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect project types
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          {
            if { [ -f package.json ] || git ls-files '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' | grep -q .; }; then
              echo 'js=true'
            else
              echo 'js=false'
            fi
            if { [ -f Cargo.toml ] || git ls-files '*.rs' | grep -q .; }; then
              echo 'rs=true'
            else
              echo 'rs=false'
            fi
            if { [ -f pubspec.yaml ] || git ls-files '*.dart' | grep -q .; }; then
              echo 'dart=true'
            else
              echo 'dart=false'
            fi
            if { [ -f gleam.toml ] || git ls-files '*.gleam' | grep -q .; }; then
              echo 'gleam=true'
            else
              echo 'gleam=false'
            fi
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.detect.outputs.js == 'true' || steps.detect.outputs.rs == 'true' || steps.detect.outputs.dart == 'true' || steps.detect.outputs.gleam == 'true'
        with:
          node-version: "22"

      - name: Validate the vendored policy runtime before use
        if: steps.detect.outputs.js == 'true' || steps.detect.outputs.rs == 'true' || steps.detect.outputs.dart == 'true' || steps.detect.outputs.gleam == 'true'
        run: |
          set -euo pipefail
          test -x .ores-lint/lint.sh
          test -x .ores-lint/js.sh
          node --check .ores-lint/require-send.mjs
          node --check .ores-lint/eslint/base.mjs
          node --check .ores-lint/eslint/plugin.mjs
          node --check .ores-lint/eslint/formatter.mjs
          node --test .ores-lint/*.test.mjs
          find .ores-lint -type f -name '*.sh' -exec sh -n '{}' ';'

      # These are runner tools, not application dependencies. Major ranges are
      # intentionally bounded; exact resolved versions are printed in the run.
      - name: Install bounded JavaScript lint tools
        if: steps.detect.outputs.js == 'true'
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund \
            'eslint@9' \
            'typescript-eslint@8'
          npm list --global --depth=0 eslint typescript-eslint

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.97.0
        if: steps.detect.outputs.rs == 'true'
        with:
          toolchain: "1.97.0"
          components: clippy

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        if: steps.detect.outputs.dart == 'true'

      - name: Run ores-lint
        run: sh .ores-lint/lint.sh
        env:
          # Warn-only until the repository explicitly promotes findings to a gate.
          ORES_LINT_STRICT: "0"
