name: rpc-manifest

# The /v1/rpc operation manifest is derived from operations.json, never authored.
# This gate fails when the committed manifest is stale, when derivation stops
# being deterministic, or when the projection loses, invents, or misplaces an
# operation or parameter.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rpc-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - working-directory: rpc/generator
        run: cargo fmt --all -- --check
      - working-directory: rpc/generator
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - working-directory: rpc/generator
        run: cargo test --all-targets --all-features --locked
      # Regenerating must not change a byte. Running `check` separately from the
      # test suite keeps the staleness failure readable in the job log.
      - name: The committed manifest is current
        run: cargo run --locked --manifest-path rpc/generator/Cargo.toml -- check .
      - name: Regeneration leaves the tree clean
        run: |
          cargo run --locked --manifest-path rpc/generator/Cargo.toml -- generate .
          if ! git diff --quiet -- rpc/operations.rpc.json rpc/operation-keys.json; then
            echo "::error::regenerating the RPC manifest changed the committed artifacts"
            git --no-pager diff -- rpc/operations.rpc.json rpc/operation-keys.json
            exit 1
          fi

  # Commit and build provenance is recorded ABOUT the artifact, never inside it.
  #
  # Embedding the generating commit in operations.rpc.json would make the output
  # depend on git state rather than on its input bytes: the artifact would change
  # on every unrelated commit, the staleness check above would fail constantly,
  # and the determinism check would stop meaning anything. The manifest therefore
  # carries only content identity — source_manifest_sha256, generator,
  # generator_version — and the repository, commit, workflow and builder identity
  # live in a signed attestation bound to the artifact's SHA-256 digest.
  provenance:
    needs: manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Attest the generated RPC manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            rpc/operations.rpc.json
            rpc/operation-keys.json
