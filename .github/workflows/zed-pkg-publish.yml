name: Zed-Pkg Validation

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Validate Zed Manifests
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          import sys
          import tomllib

          success = True
          skipped = {".git", "target", "node_modules", ".claude", "tmp"}

          for root, dirs, files in os.walk("."):
              dirs[:] = [name for name in dirs if name not in skipped]
              if ".zpkg.toml" not in files:
                  continue

              path = os.path.join(root, ".zpkg.toml")
              print(f"Validating {path}...")
              try:
                  with open(path, "rb") as handle:
                      data = tomllib.load(handle)

                  if "package" not in data and "workspace" not in data:
                      print(f"  Error: {path} is missing [package] or [workspace]")
                      success = False

                  if "package" in data:
                      package = data["package"]
                      required = ("org", "name", "version")
                      if not all(key in package for key in required):
                          print(f"  Error: {path} [package] is missing org, name, or version")
                          success = False
                      else:
                          print(
                              "  Package OK: {}/{} v{}".format(
                                  package["org"], package["name"], package["version"]
                              )
                          )

                  if "workspace" in data:
                      workspace = data["workspace"]
                      if "members" not in workspace:
                          print(f"  Error: {path} [workspace] is missing members")
                          success = False
                      else:
                          print(f"  Workspace OK: members={workspace['members']}")
              except (OSError, tomllib.TOMLDecodeError, TypeError) as error:
                  print(f"  Error parsing {path}: {error}")
                  success = False

          if not success:
              sys.exit(1)
          print("\nAll manifests are structurally valid.")
          PY
