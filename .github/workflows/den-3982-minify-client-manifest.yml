name: DEN-3982 normalize client manifest

on:
  push:
    branches:
      - "fix/DEN-3982-current-main-dart-publish-contract"
    paths:
      - ".github/workflows/den-3982-minify-client-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Normalize and commit only the manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/DEN-3982-current-main-dart-publish-contract"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('clients/contract-manifest.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          path.write_text(
              json.dumps(document, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          python3 -m json.tool clients/contract-manifest.json >/dev/null
          if git diff --quiet -- clients/contract-manifest.json; then
            exit 0
          fi
          git diff --check -- clients/contract-manifest.json
          git config user.name "ORESoftware"
          git config user.email "alex@oresoftware.com"
          git add -- clients/contract-manifest.json
          git commit -m "chore(DEN-3982): normalize refreshed client manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"
