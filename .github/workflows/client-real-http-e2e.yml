name: Real HTTP SDK E2E
on:
  pull_request:
    paths:
      - "tests/live-http.test.ts"
      - "clients/ts/fiducia.ts"
      - ".github/workflows/client-real-http-e2e.yml"
  push:
    branches: [main]
    paths:
      - "tests/live-http.test.ts"
      - "clients/ts/fiducia.ts"
      - ".github/workflows/client-real-http-e2e.yml"

permissions:
  contents: read

concurrency:
  group: client-real-http-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  socket-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22.22.1"
      - name: Client-server socket integration
        run: node --test --experimental-strip-types tests/live-http.test.ts
