name: Zed package contract

on:
  push:
    branches: [main]
    paths:
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "zed-package-exceptions.toml"
      - "clients/**"
      - "test/**"
      - "scripts/check-package-contract.py"
      - ".github/workflows/zed-package-contract.yml"
  pull_request:
    paths:
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "zed-package-exceptions.toml"
      - "clients/**"
      - "test/**"
      - "scripts/check-package-contract.py"
      - ".github/workflows/zed-package-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-package-contract.py

  typescript-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build and test the native TypeScript package
        working-directory: clients/ts
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present
      - name: Import under Node, Deno, and Bun
        run: |
          node --experimental-strip-types test/runtime-import-smoke.mjs
          deno run --allow-read test/runtime-import-smoke.mjs
          bun run test/runtime-import-smoke.mjs
      - name: Import under a local Workers runtime
        working-directory: clients/ts
        run: npm install --no-save wrangler@4
      - run: node test/run-edge-smoke.mjs
