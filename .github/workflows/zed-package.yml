name: Zed package interoperability

# Verifies the per-language publish model on every push, and publishes on a tag.
#
# One repo, one version, N packages: each language subtree is packed as its own
# artifact named `<package.name>-<target>`, re-rooted at that subtree, carrying
# its native package-manager manifest and a derived `.zpkg.toml` that declares
# which language and ecosystem it is for. That last part is what lets a consumer
# install refuse a `-java` client in a Node project.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zed-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          persist-credentials: false
          fetch-depth: 0

      # NOTE: these pins must be bumped to a commit that includes the
      # language/ecosystem manifest fields and the go/python/rust/dart adapters,
      # otherwise `[targets.*].adapter = "go"` fails manifest validation.
      - name: Check out pinned zed CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-cli
          ref: main
          path: zed-cli
          persist-credentials: false

      - name: Check out pinned zed interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: main
          path: zed-interfaces
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Configure isolated pack output
        run: echo "ZED_PACK_OUT=$RUNNER_TEMP/zed-pack" >> "$GITHUB_ENV"

      - name: Pack every zed target
        working-directory: source
        run: cargo run --quiet --locked --manifest-path ../zed-cli/Cargo.toml -- pack --out "$ZED_PACK_OUT"

      - name: Verify one isolated, self-describing package per language
        working-directory: source
        run: |
          python3 - <<'PY'
          import io
          import os
          import pathlib
          import tarfile
          import tomllib

          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ["ZED_PACK_OUT"])
          with (root / ".zpkg.toml").open("rb") as handle:
              manifest = tomllib.load(handle)
          with (root / ".zpkg.lock").open("rb") as handle:
              lock = tomllib.load(handle)
          assert lock["version"] == 1, "unsupported .zpkg.lock version"

          package = manifest["package"]
          targets = manifest.get("targets", {})
          assert targets, "a clients repo must declare one target per language"

          # No target may package the whole repo: a fat artifact holding every
          # language is exactly what per-language packages exist to avoid, and
          # being language-agnostic it would not be ecosystem-gated either.
          for target, section in targets.items():
              assert section["dir"].strip("./") not in ("", "."), (
                  f"target `{target}` packages the repository root; "
                  "every target must be re-rooted at one language subtree"
              )

          expected = {}
          for target, section in targets.items():
              name = section.get("name", f"{package['name']}-{target}")
              archive = out / f"{package['org']}-{name}-{package['version']}.tar.gz"
              expected[target] = archive
              assert archive.is_file(), f"missing {target} artifact: {archive.name}"

          actual = set(out.glob("*.tar.gz"))
          assert actual == set(expected.values()), (
              f"unexpected artifact set: expected {len(expected)}, got {len(actual)}"
          )

          archive_members = {}
          for target, archive in expected.items():
              with tarfile.open(archive, "r:gz") as packed:
                  names = packed.getnames()
                  assert names and all(name == "pkg" or name.startswith("pkg/") for name in names)
                  assert not any(".." in pathlib.PurePosixPath(name).parts for name in names)
                  member = packed.extractfile("pkg/.zpkg.toml")
                  assert member is not None, f"{target} has no derived manifest"
                  derived = tomllib.load(io.BytesIO(member.read()))
              expected_name = targets[target].get("name", f"{package['name']}-{target}")
              assert derived["package"]["name"] == expected_name
              assert not derived.get("targets"), f"{target} artifact is still polyglot"
              # Each published package must state what it is for. Without this a
              # consumer install has nothing to check, and a -java client can be
              # dropped into a Node project with no complaint.
              declared = derived["package"].get("language")
              assert declared, (
                  f"{target} artifact declares no language; consumers cannot be guarded"
              )
              assert derived["package"].get("ecosystem") or declared, (
                  f"{target} artifact declares no ecosystem"
              )
              archive_members[target] = names

          native_manifests = {
              "nodejs": ["package.json"],
              "python": ["pyproject.toml", "setup.py"],
              "golang": ["go.mod"],
              "rust": ["Cargo.toml"],
              "rust-wasm": ["Cargo.toml"],
              "java": ["pom.xml", "build.gradle", "build.gradle.kts"],
              "csharp": ["*.csproj", "*.nuspec"],
              "ruby": ["*.gemspec"],
              "php": ["composer.json"],
              "dart": ["pubspec.yaml"],
              "flutter": ["pubspec.yaml"],
              "elixir": ["mix.exs"],
              "gleam": ["gleam.toml"],
              "fsharp": ["*.fsproj"],
              "ocaml": ["*.opam", "dune-project"],
              "clojure": ["deps.edn", "project.clj"],
              "scala": ["build.sbt"],
              "kotlin": ["build.gradle.kts", "pom.xml"],
              "erlang": ["rebar.config"],
              "swift": ["Package.swift"],
              "cpp": ["CMakeLists.txt"],
              "zig": ["build.zig"],
              "haskell": ["*.cabal"],
              "julia": ["Project.toml"],
              "r": ["DESCRIPTION"],
              "nim": ["*.nimble"],
              "crystal": ["shard.yml"],
              "lua": ["*.rockspec"],
              "powershell": ["*.psd1"],
          }
          for target, section in targets.items():
              source = root / section["dir"]
              assert source.is_dir(), f"target `{target}` dir `{section['dir']}` is missing"
              patterns = native_manifests.get(target)
              if patterns:
                  native_files = sorted({
                      path
                      for pattern in patterns
                      for path in source.glob(pattern)
                      if path.is_file()
                  })
                  assert native_files, (
                      f"{target} has no native package-manager manifest ({', '.join(patterns)})"
                  )
                  assert any(
                      f"pkg/{path.relative_to(source).as_posix()}" in archive_members[target]
                      for path in native_files
                  ), f"{target} artifact omitted its native package-manager manifest"
              # Re-rooted: the artifact must not still carry its own source path.
              prefix = f"pkg/{section['dir'].strip('./')}/"
              assert not any(name.startswith(prefix) for name in archive_members[target]), (
                  f"{target} artifact was not re-rooted"
              )

          # The decisive property: no artifact carries another language's source.
          # This is what makes "a Java consumer downloads Java bytes only" true
          # rather than aspirational.
          for target, names in archive_members.items():
              own = pathlib.PurePosixPath(targets[target]["dir"].strip("./"))
              for other, section in targets.items():
                  if other == target:
                      continue
                  other_dir = pathlib.PurePosixPath(section["dir"].strip("./"))
                  # Skip nested layouts where one target legitimately contains
                  # another (none today, but do not false-alarm if that changes).
                  if own in other_dir.parents or other_dir in own.parents:
                      continue
                  leaked = [n for n in names if f"/{other_dir.name}/" in f"/{n}/"
                            and other_dir.name != own.name]
                  assert not leaked, (
                      f"{target} artifact leaked {other} source: {leaked[:3]}"
                  )

          print(
              f"verified {len(expected)} isolated language artifacts, "
              "each self-describing and free of other languages' source"
          )
          PY

      - name: Exercise publish planning without uploading
        working-directory: source
        run: cargo run --quiet --locked --manifest-path ../zed-cli/Cargo.toml -- publish --dry-run --skip-vcs-checks

      # A tag is the release trigger: `zed publish` verifies the tag exists and
      # points at this commit, then uploads one artifact per language.
      - name: Publish every language package
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: source
        env:
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
        run: |
          if [ -z "$ZED_PKG_TOKEN" ]; then
            echo "::error::ZED_PKG_TOKEN is not set; cannot publish"
            exit 1
          fi
          cargo run --quiet --locked --manifest-path ../zed-cli/Cargo.toml -- publish
