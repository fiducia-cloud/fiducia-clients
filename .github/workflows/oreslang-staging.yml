name: Oreslang unadmitted-target safety gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  staged-oreslang:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: fiducia-cloud/fiducia-clients Oreslang candidate negative regressions
        run: node --test tests/oreslang-staging.test.mjs
      - name: fiducia-cloud/fiducia-clients exact current target matrix admission
        run: node scripts/verify-oreslang-staging.mjs
