name: Publish private SDK bundle

on:
  pull_request:
    paths:
      - "Dockerfile.github-package"
      - "Dockerfile.github-package.dockerignore"
      - ".github/workflows/publish-private-sdk-package.yml"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "clients/**"
      - "src/**"
      - "schemas/**"
      - "contracts/**"
      - "contract/**"
      - "scripts/**"
      - "README.md"
      - "LICENSE*"
  push:
    branches: [main]
    paths:
      - "Dockerfile.github-package"
      - "Dockerfile.github-package.dockerignore"
      - ".github/workflows/publish-private-sdk-package.yml"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "clients/**"
      - "src/**"
      - "schemas/**"
      - "contracts/**"
      - "contract/**"
      - "scripts/**"
      - "README.md"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-sdk-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKAGE_BASENAME: fiducia-clients-sdk-bundle

jobs:
  validate:
    name: Validate SDK package image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - id: source
        name: Bind package metadata to this commit
        shell: bash
        run: |
          set -euo pipefail
          created_at="$(git show -s --format=%cI HEAD)"
          printf 'created=%s\n' "$created_at" >> "$GITHUB_OUTPUT"
      - name: Build an unpushed OCI validation archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.github-package
          push: false
          tags: local/fiducia-clients-sdk-bundle:validation
          build-args: |
            SOURCE_REPOSITORY=${{ github.repository }}
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_CREATED=${{ steps.source.outputs.created }}
          outputs: type=oci,dest=${{ runner.temp }}/fiducia-clients-sdk-bundle.oci
          provenance: false
      - name: Verify the OCI archive exists
        shell: bash
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/fiducia-clients-sdk-bundle.oci"
          tar -tf "${RUNNER_TEMP}/fiducia-clients-sdk-bundle.oci" | grep -Fxq index.json
          tar -tf "${RUNNER_TEMP}/fiducia-clients-sdk-bundle.oci" | grep -Fxq oci-layout

  publish:
    name: Publish immutable private SDK package
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Authenticate to GitHub Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: package
        name: Compute immutable package identity
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          created_at="$(git show -s --format=%cI HEAD)"
          {
            printf 'image=ghcr.io/%s/%s\n' "$owner" "$PACKAGE_BASENAME"
            printf 'tag=sha-%s\n' "$GITHUB_SHA"
            printf 'created=%s\n' "$created_at"
          } >> "$GITHUB_OUTPUT"
      - id: publish
        name: Build and publish by immutable source tag
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.github-package
          push: true
          tags: ${{ steps.package.outputs.image }}:${{ steps.package.outputs.tag }}
          build-args: |
            SOURCE_REPOSITORY=${{ github.repository }}
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_CREATED=${{ steps.package.outputs.created }}
          provenance: true
          sbom: true
      - name: Verify immutable publication receipt
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::package publication did not return an immutable digest"
            exit 1
          }
          printf 'Published `%s:%s` at `%s`.\n' \
            "${{ steps.package.outputs.image }}" \
            "${{ steps.package.outputs.tag }}" \
            "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
