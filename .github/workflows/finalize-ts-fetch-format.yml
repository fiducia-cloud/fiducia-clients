name: Finalize TypeScript fetch binding formatting

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/finalize-ts-fetch-format.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalize-ts-fetch-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ts-browser-e2e-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ts-browser-e2e-hardening
          fetch-depth: 0

      - name: Normalize the reviewed template and regenerate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("templates/typescript.ts.tmpl")
          text = path.read_text(encoding="utf-8")
          constructor = text.index("  constructor(baseUrl: string")
          start = text.index("    if (opts.fetch) {", constructor)
          end = text.index("    this.requestTimeoutMs", start)
          normalized = (
              "    if (opts.fetch) {\n"
              "      this.fetchImpl = opts.fetch;\n"
              "    } else {\n"
              "      const defaultFetch = globalThis.fetch;\n"
              "      if (typeof defaultFetch !== \"function\") {\n"
              "        throw new Error(\"fiducia: global fetch is unavailable; provide opts.fetch\");\n"
              "      }\n"
              "      // Browser fetch is a Web IDL method and must retain its global receiver.\n"
              "      this.fetchImpl = defaultFetch.bind(globalThis);\n"
              "    }\n"
          )
          path.write_text(text[:start] + normalized + text[end:], encoding="utf-8")
          PY

          python3 generate.py ts
          python3 generate.py --check ts
          node --check clients/ts/browser-smoke.mjs
          node --check clients/ts/chrome-cdp.mjs
          test "$(grep -Fc '      this.fetchImpl = opts.fetch;' templates/typescript.ts.tmpl)" = 1
          test "$(grep -Fc '      this.fetchImpl = opts.fetch;' clients/ts/fiducia.ts)" = 1
          test "$(grep -Fc '      this.fetchImpl = defaultFetch.bind(globalThis);' templates/typescript.ts.tmpl)" = 1
          test "$(grep -Fc '      this.fetchImpl = defaultFetch.bind(globalThis);' clients/ts/fiducia.ts)" = 1
          git diff --check

      - name: Commit only generated source and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-ts-fetch-format.yml
          git add templates/typescript.ts.tmpl clients/ts/fiducia.ts
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/finalize-ts-fetch-format.yml
            clients/ts/fiducia.ts
            templates/typescript.ts.tmpl
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(ts): normalize generated fetch binding"
          git push origin HEAD:agent/ts-browser-e2e-hardening
