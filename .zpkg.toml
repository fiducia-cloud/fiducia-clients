[package]
org = "fiducia"
name = "fiducia-clients"
version = "0.1.0"
description = "Official polyglot clients for fiducia.cloud"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "fiducia"]

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-clients"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".zed-pack/**", "tmp/**", "**/*.log", ".DS_Store"]


# One target per language subtree. `zed publish` fans this out to one
# independently installable package each, named `<package.name>-<target>`, so a
# consumer downloads only the language it can build against -- and the ecosystem
# recorded in every artifact stops it installing anywhere else.
#
# Target keys are the colloquial language names so published package names read
# the way people search for them; project inference matches them through
# language synonyms (a `package.json` project resolves `nodejs`, `go.mod`
# resolves `golang`).

[targets.nodejs]
dir = "clients/ts"
adapter = "node"

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.golang]
dir = "clients/go"
adapter = "go"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust-wasm]
dir = "clients/rust-wasm"
adapter = "node"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.csharp]
dir = "clients/csharp"

[targets.ruby]
dir = "clients/ruby"

[targets.php]
dir = "clients/php"

[targets.shell]
dir = "clients/shell"

[targets.powershell]
dir = "clients/powershell"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.elixir]
dir = "clients/elixir"

[targets.gleam]
dir = "clients/gleam"

[targets.fsharp]
dir = "clients/fsharp"

[targets.ocaml]
dir = "clients/ocaml"

[targets.clojure]
dir = "clients/clojure"
adapter = "java"

[targets.scala]
dir = "clients/scala"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.erlang]
dir = "clients/erlang"

[targets.swift]
dir = "clients/swift"

[targets.cpp]
dir = "clients/cpp"

[targets.c]
dir = "clients/c"

[targets.zig]
dir = "clients/zig"

[targets.haskell]
dir = "clients/haskell"

[targets.julia]
dir = "clients/julia"

[targets.r]
dir = "clients/r"

[targets.matlab]
dir = "clients/matlab"

[targets.nim]
dir = "clients/nim"

[targets.crystal]
dir = "clients/crystal"

[targets.lua]
dir = "clients/lua"
